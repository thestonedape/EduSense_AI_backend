name: Keep demo services awake
# Free Supabase projects pause after about a week without activity, and the
# backend cannot boot without them. /ready queries PostgreSQL, so a regular
# ping keeps the database active and wakes the Render instance.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping readiness
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 120 https://edusense-ai-backend.onrender.com/ready; then exit 0; fi
            sleep 30
          done
          exit 1
