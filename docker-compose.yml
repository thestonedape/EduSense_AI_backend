services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edusense
    ports: ["5433:5432"]
    volumes: ["edusense_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edusense"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    environment: &environment
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/edusense
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/edusense
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-test-key-change-me}
      STORAGE_BACKEND: local
      ENVIRONMENT: development
      AUTO_BOOTSTRAP_SCHEMA: "false"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment: *environment
    ports: ["8000:8000"]
    volumes: ["lecture_files:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    command: ["arq", "app.workers.queue.WorkerSettings"]
    environment: *environment
    volumes: ["lecture_files:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  edusense_data:
  lecture_files:
